name: seal-build

# Pack-only build for the org.webjars.npm:handlebars WebJar. The test suite runs
# on Travis (.travis.yml); this workflow builds dist/ like the Travis publish leg
# (Node 10), packs the npm tarball and re-roots it into the WebJars jar layout.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '10'
      - name: Install dependencies
        run: npm ci
      - name: Build dist
        run: npx grunt --stack clean parser node globals amd uglify copy:dist
      - name: Pack npm tarball
        run: |
          npm pack --ignore-scripts
          ls -l handlebars-*.tgz
      - name: Assemble WebJar
        run: |
          set -euo pipefail
          NAME=handlebars
          VERSION=4.5.3
          TGZ=$(ls "$PWD"/handlebars-*.tgz)
          ROOT=$RUNNER_TEMP/jarroot
          WEBJAR=META-INF/resources/webjars/$NAME/$VERSION
          MAVEN=META-INF/maven/org.webjars.npm/$NAME
          rm -rf "$ROOT" "$RUNNER_TEMP/unpack"
          mkdir -p "$ROOT/$WEBJAR" "$ROOT/$MAVEN" "$RUNNER_TEMP/unpack" out
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/unpack"
          cp -r "$RUNNER_TEMP/unpack/package/." "$ROOT/$WEBJAR/"
          # Descriptors emitted by WebJars' sync tool (byte-identical to the
          # published .pom); '~' marks whitespace-only lines.
          cat > "$ROOT/$MAVEN/pom.xml" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0_0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <packaging>jar</packaging>
              <groupId>org.webjars.npm</groupId>
              <artifactId>handlebars</artifactId>
              <version>4.5.3</version>
              <name>handlebars</name>
              <description>WebJar for handlebars</description>
              <url>http://webjars.org</url>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <scm>
                  <url>https://github.com/wycats/handlebars.js</url>
                  <connection>https://github.com/wycats/handlebars.js.git</connection>
                  <developerConnection>https://github.com/wycats/handlebars.js.git</developerConnection>
                  <tag>v4.5.3</tag>
              </scm>

              <developers>
                  <developer>
                      <id>webjars</id>
                      <url>http://webjars.org</url>
                  </developer>
              </developers>

              <licenses>
                  ~
                  <license>
                      <name>MIT</name>
                      <url>https://spdx.org/licenses/MIT#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  ~
              </licenses>

              ~
              <issueManagement>
                  <url>https://github.com/wycats/handlebars.js/issues</url>
              </issueManagement>
              ~

              <dependencies>
                  ~
                  <dependency>
                      <groupId>org.webjars.npm</groupId>
                      <artifactId>neo-async</artifactId>
                      <version>[2.6.0,3)</version>
                  </dependency>
                  ~
                  <dependency>
                      <groupId>org.webjars.npm</groupId>
                      <artifactId>optimist</artifactId>
                      <version>[0.6.1,0.7)</version>
                  </dependency>
                  ~
                  <dependency>
                      <groupId>org.webjars.npm</groupId>
                      <artifactId>source-map</artifactId>
                      <version>[0.6.1,0.7)</version>
                  </dependency>
                  ~
                  ~
                  <dependency>
                      <groupId>org.webjars.npm</groupId>
                      <artifactId>uglify-js</artifactId>
                      <version>[3.1.4,4)</version>
                      <optional>true</optional>
                  </dependency>
                  ~
              </dependencies>

          </project>
          POM
          sed -i 's/~$//' "$ROOT/$MAVEN/pom.xml"
          printf '\n#Generated by WebJar Sync\nversion=%s\ngroupId=org.webjars.npm\nartifactId=%s\n       ' "$VERSION" "$NAME" > "$ROOT/$MAVEN/pom.properties"
          echo "2c7e8db6336dc131ba8aec58307c5c0b  $ROOT/$MAVEN/pom.xml" | md5sum -c -
          echo "5abdc6704e5cf0097af674df0b80a674  $ROOT/$MAVEN/pom.properties" | md5sum -c -
          JAR=$PWD/out/$NAME-$VERSION.jar
          cd "$ROOT"
          # WebJars layout: 5 directory entries, no MANIFEST.MF, no other dirs.
          zip -X -q "$JAR" META-INF/ META-INF/resources/ META-INF/resources/webjars/ "META-INF/resources/webjars/$NAME/" "$WEBJAR/"
          { echo "$MAVEN/pom.xml"; echo "$MAVEN/pom.properties"; find "$WEBJAR" -type f | sort; } | zip -X -q -D "$JAR" -@
          FILES=$(tar -tzf "$TGZ" | grep -vc '/$')
          ENTRIES=$(unzip -Z1 "$JAR" | wc -l)
          echo "tarball files: $FILES, jar entries: $ENTRIES"
          test "$ENTRIES" -eq $((FILES + 7))
          ! unzip -Z1 "$JAR" | grep -q MANIFEST.MF
      - uses: actions/upload-artifact@v4
        with:
          name: handlebars-webjar
          path: out/handlebars-*.jar
          if-no-files-found: error
